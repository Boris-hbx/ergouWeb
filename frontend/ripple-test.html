<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Tab Animation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #efeff4;
            color: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            min-height: 100vh;
            padding: 40px 16px 50px;
            gap: 44px;
        }
        h2 {
            font-weight: 500;
            opacity: 0.4;
            font-size: 11px;
            margin-bottom: 8px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== Telegram-accurate Tab Bar ===== */
        .tab-bar {
            display: flex;
            background: rgba(220, 220, 225, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 3px;
            position: relative;
            gap: 2px;
            width: min(340px, 88vw);
            box-shadow: 0 0.5px 0 rgba(0,0,0,0.06),
                        0 4px 16px rgba(0,0,0,0.08);
        }
        .tab-bar .indicator {
            position: absolute;
            background: #fff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08),
                        0 3px 10px rgba(0,0,0,0.06);
            pointer-events: none;
            will-change: left, width, height, border-radius;
        }
        .tab-bar .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            padding: 7px 4px 5px;
            border: none;
            background: none;
            color: #99a2ad;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            position: relative;
            z-index: 1;
            transition: color 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .tab-bar .tab-item.active { color: #2AABEE; }
        .tab-bar .tab-item .ico {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .tab-bar .tab-item .ico svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* ===== Dark theme ===== */
        .dark-wrap {
            background: #1c1c1e;
            width: 100vw;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .dark-wrap h2 { color: rgba(255,255,255,0.4); }
        .dark-wrap .tab-bar {
            background: rgba(44, 44, 46, 0.85);
            box-shadow: 0 0.5px 0 rgba(255,255,255,0.04),
                        0 4px 16px rgba(0,0,0,0.3);
        }
        .dark-wrap .tab-bar .indicator {
            background: rgba(255,255,255,0.1);
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        }
        .dark-wrap .tab-bar .tab-item { color: rgba(255,255,255,0.3); }
        .dark-wrap .tab-bar .tab-item.active { color: #667eea; }
    </style>
</head>

<script>
function spring(pos, vel, target, stiffness, damping, dt) {
    var f = -stiffness * (pos - target) - damping * vel;
    vel += f * dt;
    pos += vel * dt;
    return { p: pos, v: vel };
}
function settled(p, v, t, th) {
    return Math.abs(p - t) < (th || 0.3) && Math.abs(v) < (th || 0.3);
}

function initBar(id) {
    var bar = document.getElementById(id);
    var ind = bar.querySelector('.indicator');
    var tabs = bar.querySelectorAll('.tab-item');
    var anim = null;

    var fullH = bar.offsetHeight - 6;
    var circleSize = fullH;

    function setPill(cx, w) {
        ind.style.width = w + 'px';
        ind.style.height = fullH + 'px';
        ind.style.left = (cx - w / 2) + 'px';
        ind.style.top = '3px';
        ind.style.borderRadius = (w <= fullH * 1.2) ? '50%' : (fullH / 2) + 'px';
    }

    var first = tabs[0];
    var fullW = first.offsetWidth;
    setPill(first.offsetLeft + fullW / 2, fullW);

    tabs.forEach(function(tab) {
        tab.addEventListener('click', function() {
            var prev = bar.querySelector('.tab-item.active');
            if (prev === tab) return;
            tabs.forEach(function(t) { t.classList.remove('active'); });
            tab.classList.add('active');
            if (anim) cancelAnimationFrame(anim);

            var fromCx = prev.offsetLeft + prev.offsetWidth / 2;
            var toCx = tab.offsetLeft + tab.offsetWidth / 2;
            var targetW = tab.offsetWidth;

            // Bouncy C-style animation
            var cx = fromCx, vCx = 0;
            var w = parseFloat(ind.style.width) || targetW, vW = 0;
            var phase = 0;
            var last = performance.now();

            function step(now) {
                var dt = Math.min((now - last) / 1000, 0.03);
                last = now;

                // Position always slides toward target
                var rp = spring(cx, vCx, toCx, 350, 26, dt);
                cx = rp.p; vCx = rp.v;

                if (phase === 0) {
                    // Shrink while sliding
                    var rw = spring(w, vW, circleSize * 0.9, 600, 32, dt);
                    w = rw.p; vW = rw.v;
                    // Switch to expand when near target
                    if (Math.abs(cx - toCx) < 8) {
                        phase = 1;
                        vW = 15; // outward impulse
                    }
                } else {
                    // Expand with bouncy spring
                    var rw = spring(w, vW, targetW, 280, 10, dt);
                    w = rw.p; vW = rw.v;
                }

                setPill(cx, Math.max(w, circleSize * 0.8));

                if (phase === 1 && settled(cx, vCx, toCx, 0.3) && settled(w, vW, targetW, 0.4)) {
                    setPill(toCx, targetW);
                    anim = null; return;
                }
                anim = requestAnimationFrame(step);
            }
            anim = requestAnimationFrame(step);
        });
    });
}

initBar('demo3');
</script>
